name: Recruiter Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"


jobs:
  analyze:

    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: recruiter-assistant


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: recruiter-assistant/package-lock.json


    - name: Install dependencies
      run: npm ci


    - name: Run Recruiter Assistant
      run: npm start
      env:

        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}


    - name: Commit processed emails
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add recruiter-assistant/data/processed.json

        git diff --cached --quiet || git commit -m "Update recruiter processed emails"

        git push
      working-directory: .