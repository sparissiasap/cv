name: Recruiter Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recruiter-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets
        run: |
          echo "CLIENT JSON length: ${#GOOGLE_CLIENT_SECRET_JSON}"
          echo "TOKEN JSON length: ${#GOOGLE_TOKEN_JSON}"
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recruiter-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Recruiter Assistant
        run: npm start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Commit processed emails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              
          git add recruiter-assistant/data/processed.json
              
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update recruiter processed emails"
            git push origin HEAD:${{ github.ref }}
          fi
        working-directory: .