name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Optimize images
        run: node scripts/optimize-images.mjs

      - name: Generate MisFinanzas OG image
        run: node scripts/generate-misfinanzas-og.mjs

      - name: Backfill badges
        run: node scripts/backfill-badges.mjs

      - name: Build Angular app
        run: npx ng build --configuration production

      - name: Generate per-profile pages with correct OG tags
        run: node scripts/generate-og-pages.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prerender routes
        run: node scripts/prerender.mjs

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/cv-site/browser'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4