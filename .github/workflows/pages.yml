name: Deploy to GitHub Pages

on:
  push:
    branches: [master] # Cubre ambas opciones por si acaso
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app
        run: npx ng build --configuration production

      - name: Generate per-profile pages with correct OG tags
        run: node scripts/generate-og-pages.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prerender routes
        run: node scripts/prerender.mjs

      # 1. Configurar GitHub Pages antes de empaquetar
      - uses: actions/configure-pages@v4

      # 2. Subir el directorio de compilación (Asegúrate de que coincida con angular.json)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/cv-site/browser' # Valida que esta ruta sea exacta según tu angular.json

      # 3. Desplegar artefacto
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4