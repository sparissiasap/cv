@if (availableLangs.length >= 2) {
  <div class="cv-lang-toggle">
    @for (lang of availableLangs; track lang) {
      <button class="cv-lang-btn"
        [class.active]="lang === currentLang"
        [disabled]="lang === currentLang"
        (click)="switchLang(lang)"
        [attr.aria-label]="'Cambiar idioma a ' + lang.toUpperCase()">
        {{ lang.toUpperCase() }}
      </button>
    }
  </div>
}
