<div class="certs-section">
  <div class="section-label" style="padding:0 4px 16px;font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;">
    {{ gallery.label }}
  </div>
  <div class="certs-grid">
    @for (cert of gallery.certs; track cert.title) {
      <div class="cert-card">
        <div [class]="'cert-card-icon ' + (cert.type || '')">{{ cert.icon }}</div>
        <div class="cert-card-title">
          {{ cert.title }}
          @if (cert.badge) {
            <span class="cert-badge">{{ cert.badge }}</span>
          }
        </div>
        <div class="cert-card-meta">{{ cert.issuer }} · {{ cert.date }}</div>
        <button class="cert-card-btn" (click)="open(cert)">View Certificate ↗</button>
      </div>
    }
  </div>
</div>
