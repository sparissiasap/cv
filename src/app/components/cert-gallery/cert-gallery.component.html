<div class="certs-section">
  <div class="section-label certs-section-label">
    {{ gallery.label }}
  </div>
  <div class="certs-grid">
    @for (cert of gallery.certs; track cert.title) {
      <div class="cert-card">
        <div [class]="'cert-card-icon ' + (cert.type || '')">{{ cert.icon }}</div>
        <div class="cert-card-title">
          {{ cert.title }}
          @if (cert.badge) {
            <span class="cert-badge">{{ cert.badge }}</span>
          }
        </div>
        <div class="cert-card-meta">{{ cert.issuer }} · {{ cert.date }}</div>
        <button
         type="button"
         class="cert-card-btn"
         (click)="open(cert, $event)" 
         [attr.aria-label]="'Ver certificado: ' + cert.title">
          View Certificate ↗
        </button>
      </div>
    }
  </div>
</div>
