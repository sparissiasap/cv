<div class="card">
  <div class="section-label">{{ experience.label }}</div>
  <div class="timeline">
    @for (job of experience.jobs; track job.title + job.company; let last = $last) {
      <div class="timeline-item">
        <div class="timeline-dot-col">
          <div [class]="job.current ? 'timeline-dot current' : 'timeline-dot'"></div>
          @if (!last) {
            <div class="timeline-line"></div>
          }
        </div>
        <div class="timeline-content">
          <div class="job-meta">
            <div>
              <div class="job-title-text">{{ job.title }}</div>
              <div class="job-company-text">{{ job.company }}</div>
            </div>
            <div style="text-align:right">
              <div class="job-date-text">{{ job.dateRange }}</div>
              @if (job.location) {
                <div class="job-location-text">{{ job.location }}</div>
              }
            </div>
          </div>
          <ul class="job-bullets">
            @for (bullet of job.bullets; track $index) {
              <li [innerHTML]="bullet"></li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
</div>
